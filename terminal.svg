<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" role="img" aria-labelledby="title desc">
<title id="title">Current work terminal — Lucky Store, KTL, StitchOS, and software</title>
<desc id="desc">A raised slate-navy terminal summarizes retail storefront and POS work, garment manufacturing analysis, an in-development factory system, and software engineering.</desc>
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#284966"/><stop offset=".33" stop-color="#16283F"/><stop offset="1" stop-color="#0C1B2D"/>
  </linearGradient>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2B4B6B"/><stop offset="1" stop-color="#16283F"/>
  </linearGradient>
  <linearGradient id="faceLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8BC4FC" stop-opacity=".13"/>
    <stop offset=".45" stop-color="#5F9BD7" stop-opacity=".02"/>
    <stop offset="1" stop-color="#08172A" stop-opacity="0"/>
  </linearGradient>
  <filter id="castShadow" x="-20%" y="-35%" width="160%" height="190%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <clipPath id="faceClip">
    <rect x="42" y="38" width="828" height="251" rx="16"/>
  </clipPath>
</defs>
<style>
  .scan { stroke-dasharray: 520; stroke-dashoffset: 520; animation: scan 3.6s ease-out 1 forwards; }
  .cursor { animation: blink 1.05s step-end 3; }
  @keyframes scan { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: .12; } }
  @media (prefers-reduced-motion: reduce) {
    .scan, .cursor { animation: none !important; }
    .scan { stroke-dashoffset: 0; }
  }
</style>
<rect width="960" height="335" rx="18" fill="#0B1625"/>
<rect x="1" y="1" width="958" height="333" rx="17" stroke="#2E4865" fill="none"/>
<path d="M26 309H923" stroke="#29435F" stroke-width="1" opacity=".6"/>
<!-- Stacked sidewalls and shadow preserve tangible depth in GitHub's SVG renderer. -->
<rect x="65" y="58" width="838" height="248" rx="18" fill="#030A14" opacity=".76" filter="url(#castShadow)"/>
<path d="M44 275H868L907 313H82Z" fill="#122A44" stroke="#2A5074" stroke-width="1"/>
<path d="M868 52L907 86V313L868 275Z" fill="#091B2E" stroke="#284764" stroke-width="1"/>
<path d="M83 310H903" stroke="#4B84BB" stroke-width="1" opacity=".55"/>
<rect x="42" y="38" width="828" height="251" rx="16" fill="url(#shell)" stroke="#5481AB" stroke-width="1.5"/>
<g clip-path="url(#faceClip)">
  <rect x="44" y="39" width="824" height="247" fill="url(#faceLight)"/>
  <path d="M42 54Q42 38 58 38H854Q870 38 870 54V77H42Z" fill="url(#header)"/>
  <path d="M43 76H869" stroke="#436E98" stroke-width="1"/>
  <path d="M58 79H854" stroke="#95C3F0" stroke-width="1" opacity=".24"/>
  <circle cx="68" cy="57" r="5.5" fill="#F07575"/>
  <circle cx="89" cy="57" r="5.5" fill="#F0C444"/>
  <circle cx="110" cy="57" r="5.5" fill="#61CFA0"/>
  <text x="456" y="62" text-anchor="middle" font-family="Menlo,Consolas,Monaco,monospace" font-size="13" fill="#DFEAF6" letter-spacing=".2">fatalmonk  /  current-work</text>
  <text x="845" y="61" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#91B6D8" letter-spacing="1.2">SLATE / 01</text>
  <text x="70" y="108" font-family="Menlo,Consolas,Monaco,monospace" font-size="16" fill="#F0C444">$ ls current_work</text>
  <path d="M266 102H824" fill="none" stroke="#274967" stroke-width="2"/>
  <path class="scan" d="M266 102H824" fill="none" stroke="#4E9CE7" stroke-width="2"/>
  <rect x="62" y="117" width="785" height="36" rx="7" fill="#244564" opacity=".48"/>
  <rect x="62" y="178" width="785" height="36" rx="7" fill="#244564" opacity=".28"/>
  <path d="M71 162H838M71 224H838" stroke="#31516F" stroke-width=".8" opacity=".6"/>
  <!-- A dedicated number, project, and focus column strengthens scan rhythm. -->
  <g font-family="Menlo,Consolas,Monaco,monospace" font-size="15.5">
    <text x="72" y="142" fill="#7AADE0">01</text>
    <text x="125" y="142" fill="#FFFFFF" font-weight="700">Lucky Store</text>
    <text x="344" y="142" fill="#C8D9E9" font-size="15">storefront · POS · operations</text>
    <text x="72" y="173" fill="#7AADE0">02</text>
    <text x="125" y="173" fill="#FFFFFF" font-weight="700">KTL</text>
    <text x="344" y="173" fill="#C8D9E9" font-size="15">manufacturing website · analysis</text>
    <text x="72" y="204" fill="#7AADE0">03</text>
    <text x="125" y="204" fill="#FFFFFF" font-weight="700">StitchOS</text>
    <text x="344" y="204" fill="#C8D9E9" font-size="15">factory visibility · in development</text>
    <text x="72" y="235" fill="#7AADE0">04</text>
    <text x="125" y="235" fill="#FFFFFF" font-weight="700">Software</text>
    <text x="344" y="235" fill="#C8D9E9" font-size="15">interfaces · workflows · automation</text>
  </g>
  <path d="M70 249H838" stroke="#406383" stroke-width="1"/>
  <text x="70" y="272" font-family="Menlo,Consolas,Monaco,monospace" font-size="14.3" fill="#F0C444">$</text>
  <text x="93" y="272" font-family="Menlo,Consolas,Monaco,monospace" font-size="14.3" fill="#9FC5EA">where operations meet product design</text>
  <rect class="cursor" x="431" y="258" width="8" height="16" rx="1" fill="#F0C444"/>
</g>
<path d="M57 40H850" stroke="#A0CAF0" stroke-width="1" opacity=".28"/>
<path d="M43 267V273Q43 288 58 288H853" fill="none" stroke="#93BBDE" stroke-width=".8" opacity=".18"/>
</svg>
