<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" role="img" aria-labelledby="title desc">
<title id="title">Operational terminal — Lucky Store, KTL, StitchOS, software engineering</title>
<desc id="desc">A dimensional terminal in navy, Chelsea blue, and gold. It describes retail operations and point of sale at Lucky Store, manufacturing website and analysis at KTL, the developing StitchOS system, and software engineering work.</desc>
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#1B3451"/><stop offset=".45" stop-color="#12263D"/><stop offset="1" stop-color="#0A1828"/>
  </linearGradient>
  <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F3A59"/><stop offset="1" stop-color="#12263D"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>
<style>
  .trace { stroke-dasharray:128 550; animation:trace 4.2s ease-out 1 both; }
  .cursor { animation:blink 1.1s step-end 3; }
  @keyframes trace { from { stroke-dashoffset:128; } to { stroke-dashoffset:0; } }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) {
    .trace,.cursor { animation:none !important; }
  }
</style>
<rect width="960" height="335" rx="18" fill="#0A1019"/>
<rect x="57" y="51" width="849" height="243" rx="18" fill="#020710" opacity=".7" filter="url(#shadow)"/>
<path d="M54 277H870L906 312H90Z" fill="#14324F"/>
<path d="M870 68L906 96V312L870 277Z" fill="#0C2239"/>
<rect x="42" y="38" width="828" height="251" rx="16" fill="url(#shell)" stroke="#3E6995" stroke-width="1.5"/>
<path d="M43 54Q43 39 60 39H852Q869 39 869 54V76H43Z" fill="url(#topbar)"/>
<path d="M43 76H869" stroke="#315375" stroke-width="1"/>
<path d="M60 77H852" stroke="#6FA8E2" stroke-width="1" opacity=".35"/>
<circle cx="70" cy="57" r="6" fill="#F05D5E"/>
<circle cx="92" cy="57" r="6" fill="#F0C444"/>
<circle cx="114" cy="57" r="6" fill="#52C272"/>
<text x="456" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.3" fill="#C8D9EB">fatalmonk@portfolio:~$ current-work</text>
<text x="70" y="108" font-family="Menlo,Consolas,Monaco,monospace" font-size="16" fill="#F0C444">$ ls current_work</text>
<path class="trace" d="M250 102H827" stroke="#4E9BED" stroke-width="2"/>
<text x="70" y="142" font-family="Menlo,Consolas,Monaco,monospace" font-size="16" fill="#EAF3FD">01  Lucky Store    retail storefront, POS, operations</text>
<text x="70" y="173" font-family="Menlo,Consolas,Monaco,monospace" font-size="16" fill="#EAF3FD">02  KTL            manufacturing website, production analysis</text>
<text x="70" y="204" font-family="Menlo,Consolas,Monaco,monospace" font-size="16" fill="#EAF3FD">03  StitchOS       factory visibility (in development)</text>
<text x="70" y="235" font-family="Menlo,Consolas,Monaco,monospace" font-size="16" fill="#EAF3FD">04  Software       interfaces, workflows, automation</text>
