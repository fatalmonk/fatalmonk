<title id="heading">Technology stack: interfaces, services, data and edge</title>
<desc id="detail">Elevated dark blue panels for interfaces, services, and data and edge. Technologies include TypeScript, React, Next.js, Flutter, Tailwind CSS, Python, FastAPI, Redis, PostgreSQL, Supabase, Docker, and Cloudflare.</desc>
