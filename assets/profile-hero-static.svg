<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" role="img" aria-labelledby="title desc">
<title id="title">mac.alvi — Pixels, products &amp; the beautiful game.</title>
<desc id="desc">Raised editorial lettering with a layered football tactics panel in Chelsea blue and gold.</desc>
<defs>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#203049" stroke-width=".8"/></pattern>
  <clipPath id="frame"><rect width="960" height="356" rx="17"/></clipPath>
  <linearGradient id="fieldFace" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#233C5A"/><stop offset=".45" stop-color="#132740"/><stop offset="1" stop-color="#0D1A2B"/>
  </linearGradient>
  <linearGradient id="fieldRim" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#3E7BB9"/><stop offset="1" stop-color="#142943"/>
  </linearGradient>
  <filter id="depthBlur" x="-25%" y="-25%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<g clip-path="url(#frame)">
