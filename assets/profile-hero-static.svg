  <text x="54" y="164" fill="#23518A" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="800" letter-spacing="-3">mac.alvi</text>
  <text x="52" y="162" fill="#397BC9" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="800" letter-spacing="-3">mac.alvi</text>
  <text x="51" y="160" fill="#F7FAFE" stroke="#E8F2FE" stroke-width=".35" paint-order="stroke" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="800" letter-spacing="-3">mac.alvi</text>
  <path d="M54 180H264" stroke="#347DDB" stroke-width="5" stroke-linecap="round"/>
  <text x="57" y="222" fill="#102B4A" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="-.4">Pixels, products &amp;</text>
  <text x="53" y="218" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="-.4">Pixels, products &amp;</text>
  <text x="57" y="256" fill="#614B1C" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="-.4">the beautiful game.</text>
  <text x="53" y="252" fill="#F0C444" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="-.4">the beautiful game.</text>
