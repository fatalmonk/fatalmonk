<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" role="img" aria-labelledby="title desc">
<title id="title">mac.alvi — Pixels, products &amp; the beautiful game.</title>
<desc id="desc">Dark editorial banner with a Chelsea-blue football passing arc.</desc>
<defs>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#203049" stroke-width=".8"/></pattern>
  <clipPath id="frame"><rect width="960" height="356" rx="17"/></clipPath>
</defs>
<style>
  .run { animation: kick 5.6s cubic-bezier(.2,.72,.22,1) 1 both; }
  .spin { transform-origin: 0 0; animation: spin 5.6s cubic-bezier(.2,.72,.22,1) 1 both; }
  .route { stroke-dasharray: 265; stroke-dashoffset: 265; animation: trace 5.6s ease-out 1 both; }
  .target { animation: target 5.6s ease-in-out 1 both; }
  @keyframes kick { 0%,13% { transform: translate(0px,0px); } 75%,100% { transform: translate(116px,-110px); } }
  @keyframes spin { 0%,13% { transform: rotate(0deg); } 75%,100% { transform: rotate(720deg); } }
  @keyframes trace { 0%,12% { stroke-dashoffset:265; } 74%,100% { stroke-dashoffset:0; } }
  @keyframes target { 0%,65% { opacity:.3; } 80%,100% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .run,.spin,.route,.target { animation:none !important; }
    .route { stroke-dashoffset:0; }
    .target { opacity:1; }
  }
</style>
