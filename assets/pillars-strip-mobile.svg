<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 438" role="img" aria-labelledby="title desc">
  <title id="title">Football, technology, and garment manufacturing</title>
  <desc id="desc">Three vertically stacked illustration panels for narrow screens. The illustrations are static.</desc>
  <defs>
