<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 214" role="img" aria-labelledby="pt pd">
<title id="pt">Football, software and production</title>
<desc id="pd">Three raised navy plates with dimensional lettering: football, software and garment production.</desc>
<defs>
 <linearGradient id="plate" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#1D334D"/><stop offset=".48" stop-color="#10243B"/><stop offset="1" stop-color="#0B192A"/></linearGradient>
 <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
 .pass { stroke-dasharray:130; stroke-dashoffset:0; animation:draw 4.5s ease-out 1 both; }
 .seam { animation: seam 4.5s ease-out 1 both; }
 @keyframes draw { from { stroke-dashoffset:130; } to { stroke-dashoffset:0; } }
 @keyframes seam { from { stroke-dashoffset:42; } to { stroke-dashoffset:0; } }
 @media (prefers-reduced-motion:reduce) { .pass,.seam { animation:none!important; } }
</style>
