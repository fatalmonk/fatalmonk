<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 166" role="img" aria-labelledby="pillars-title pillars-desc">
<title id="pillars-title">Football, software, and garment production</title>
<desc id="pillars-desc">Three connected interests: football culture, real-world software, and production operations.</desc>
<style>
  .pulse { stroke-dasharray:80 230; animation: travel 8s linear infinite; }
  .stitch { stroke-dasharray:6 9; animation: stitches 8s linear infinite; }
  @keyframes travel { to { stroke-dashoffset:-310; } }
  @keyframes stitches { to { stroke-dashoffset:-90; } }
  @media (prefers-reduced-motion: reduce) { .pulse,.stitch { animation:none !important; } }
</style>
<rect x="1" y="1" width="958" height="164" rx="15" fill="#0D1725" stroke="#26394F" stroke-width="2"/>
<path d="M282 21V146 M645 21V146" stroke="#294159" stroke-width="1.5"/>
<text x="25" y="37" fill="#91A9C1" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2">01 / THE CULTURE</text>
<text x="25" y="91" fill="#F8FAFD" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing="-1">FOOTBALL</text>
<text x="25" y="120" fill="#A9BBD0" font-family="Arial,Helvetica,sans-serif" font-size="16">Passion, identity, play</text>
<path d="M202 130Q233 42 264 89" fill="none" stroke="#3178D5" stroke-width="3" class="pulse"/>
<circle cx="255" cy="83" r="9" fill="#F5F8FD" stroke="#F0C444" stroke-width="2"/>
<text x="306" y="37" fill="#91A9C1" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2">02 / THE CRAFT</text>
<text x="306" y="91" fill="#F8FAFD" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing="-1">SOFTWARE</text>
<text x="306" y="120" fill="#A9BBD0" font-family="Arial,Helvetica,sans-serif" font-size="16">Useful, reliable systems</text>
<g fill="none" stroke="#2E78D4" stroke-width="2.5">
  <rect x="568" y="62" width="38" height="39" rx="6" stroke="#F0C444"/>
  <path d="M544 70H565 M544 92H565 M609 70H628 M609 92H628" class="pulse"/>
</g>
<text x="671" y="37" fill="#91A9C1" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2">03 / THE INDUSTRY</text>
<text x="671" y="91" fill="#F8FAFD" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing="-1">PRODUCTION</text>
<text x="671" y="120" fill="#A9BBD0" font-family="Arial,Helvetica,sans-serif" font-size="16">Garments and operations</text>
<path d="M675 143H922" stroke="#346EC2" stroke-width="2.5" class="stitch"/>
<circle cx="924" cy="143" r="4" fill="#F0C444"/>
</svg>
