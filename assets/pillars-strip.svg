<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="150" role="img" aria-label="Football, Technology, and Garment &amp; Fashion">
  <defs>
    <linearGradient id="chelseaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#034694" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22252A" />
      <stop offset="50%" stop-color="#034694" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#22252A" />
    </linearGradient>
    <filter id="bluePulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-card { fill: #0B0B0D; stroke: #1E2128; stroke-width: 1.2; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.8px; fill: #FDFBF7; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #8B949E; }
    .crest-ring { stroke: #034694; stroke-width: 2; fill: #0D1522; }
    .crest-inner { stroke: #F0C444; stroke-width: 1; fill: none; opacity: 0.85; }
    .crest-text { font-family: Georgia, serif; font-size: 11px; font-weight: 700; fill: #FDFBF7; letter-spacing: 0.8px; }

    .crest-reveal {
      opacity: 0;
      transform-origin: 54px 72px;
      animation: crestPop 6s ease-in-out infinite;
    }
    .pass-arc {
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: drawPass 6s ease-in-out infinite;
    }
    .ball-dot {
      opacity: 0;
      animation: ballFade 6s ease-in-out infinite;
    }
    .chip-trace-1 {
      stroke-dasharray: 28 90;
      stroke-dashoffset: 118;
      animation: pulseTrace 4.5s linear infinite;
      animation-delay: 0.8s;
    }
    .chip-trace-2 {
      stroke-dasharray: 24 90;
      stroke-dashoffset: 114;
      animation: pulseTrace 4.5s linear infinite;
      animation-delay: 1.6s;
    }
    .garment-stitch {
      stroke-dasharray: 4 4;
      stroke-dashoffset: 80;
      animation: stitchRun 5.5s linear infinite;
      animation-delay: 1.4s;
    }
    @keyframes crestPop {
      0%, 5% { opacity: 0; transform: scale(0.82); }
      15%, 85% { opacity: 1; transform: scale(1); }
      95%, 100% { opacity: 0; transform: scale(0.92); }
    }
    @keyframes drawPass {
      0%, 14% { stroke-dashoffset: 180; opacity: 0.2; }
      45%, 85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes ballFade {
      0%, 14% { opacity: 0; }
      20%, 82% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @keyframes pulseTrace {
      0% { stroke-dashoffset: 118; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes stitchRun {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .crest-reveal, .pass-arc, .ball-dot, .chip-trace-1, .chip-trace-2, .garment-stitch {
        animation: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

  <g transform="translate(8, 8)">
    <rect width="286" height="134" rx="10" class="bg-card" />
    <rect width="286" height="134" rx="10" fill="url(#chelseaGlow)" />
    <rect width="286" height="134" rx="10" fill="none" stroke="url(#cardBorder)" stroke-width="1" />
    <path d="M 82 96 Q 165 32 252 76" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3" />
    <path id="passPath" d="M 82 96 Q 165 32 252 76" fill="none" stroke="#034694" stroke-width="2" class="pass-arc" />
    <g class="ball-dot">
      <circle r="5" fill="#FDFBF7" stroke="#034694" stroke-width="1.8">
        <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.15;0.48;1" calcMode="spline" keySplines="0 0 1 1; 0.25 0.1 0.25 1; 0 0 1 1">
          <mpath href="#passPath" />
        </animateMotion>
      </circle>
    </g>
    <!-- Placeholder fan monogram, not an official Chelsea FC crest. -->
    <g id="cfc-crest-slot" class="crest-reveal">
      <circle cx="54" cy="72" r="22" class="crest-ring" />
      <circle cx="54" cy="72" r="17.5" class="crest-inner" />
      <text x="54" y="76" text-anchor="middle" class="crest-text">CFC</text>
    </g>
    <text x="92" y="106" class="title">FOOTBALL</text>
    <text x="92" y="121" class="subtitle">Blue is the colour · Tactical mindset</text>
  </g>

  <g transform="translate(307, 8)">
    <rect width="286" height="134" rx="10" class="bg-card" />
    <g stroke="#1E242B" stroke-width="1.5" fill="none">
      <path d="M 24 44 H 52 L 62 54 H 74" />
      <path d="M 24 78 H 48 L 58 68 H 74" />
      <path d="M 116 54 H 132 L 142 44 H 170" />
      <path d="M 116 68 H 134 L 144 78 H 170" />
    </g>
    <g stroke="#257AFD" stroke-width="2" fill="none" filter="url(#bluePulseGlow)">
      <path d="M 24 44 H 52 L 62 54 H 74" class="chip-trace-1" />
      <path d="M 116 54 H 132 L 142 44 H 170" class="chip-trace-1" />
      <path d="M 24 78 H 48 L 58 68 H 74" class="chip-trace-2" />
      <path d="M 116 68 H 134 L 144 78 H 170" class="chip-trace-2" />
    </g>
    <rect x="74" y="42" width="42" height="38" rx="6" fill="#11151C" stroke="#034694" stroke-width="1.6" />
    <rect x="82" y="50" width="26" height="22" rx="3" fill="#0B0B0D" stroke="#F0C444" stroke-width="1" />
    <circle cx="95" cy="61" r="3" fill="#034694" />
    <text x="24" y="106" class="title">TECHNOLOGY</text>
    <text x="24" y="121" class="subtitle">Edge systems · Applied AI &amp; POS</text>
  </g>

  <g transform="translate(606, 8)">
    <rect width="286" height="134" rx="10" class="bg-card" />
    <path d="M 48 34 L 62 28 L 72 35 L 82 28 L 96 34 L 106 54 L 96 60 L 91 48 L 91 84 L 53 84 L 53 48 L 48 60 L 38 54 Z" fill="#121419" stroke="#2B303A" stroke-width="1.4" stroke-linejoin="round" />
    <path d="M 53 48 L 53 84 L 91 84 L 91 48 M 62 28 L 72 35 L 82 28 M 72 35 L 72 84" fill="none" stroke="#F0C444" stroke-width="1.5" stroke-linecap="round" class="garment-stitch" />
    <rect x="67" y="40" width="10" height="4" rx="1" fill="#034694" />
    <text x="124" y="56" class="title">GARMENT &amp;</text>
    <text x="124" y="71" class="title">FASHION</text>
    <text x="124" y="90" class="subtitle">From thread to</text>
    <text x="124" y="104" class="subtitle">global export</text>
  </g>
</svg>
